# Staging stack. Mirrors docker-compose.yml (prod) with -stage naming,
# its own Redis container/volume, and a different host port so it can
# run alongside prod on the same host. Mongo is external — configure
# DATABASE_URL in .env.stage. Shares the same network as prod; create
# it once:
#   docker network create dress-doctor-net
services:
  redis-stage:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_stage_data:/data
    networks:
      - dress-doctor
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10

  api-stage:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/main']
    env_file:
      - .env.stage
    environment:
      PORT: '3000'
      REDIS_HOST: redis-stage
      REDIS_PORT: '6379'
    ports:
      - '3001:3000'
    networks:
      - dress-doctor
    depends_on:
      redis-stage:
        condition: service_healthy

  worker-stage:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker']
    env_file:
      - .env.stage
    environment:
      REDIS_HOST: redis-stage
      REDIS_PORT: '6379'
    networks:
      - dress-doctor
    depends_on:
      redis-stage:
        condition: service_healthy

networks:
  dress-doctor:
    external: true
    name: dress-doctor-net

volumes:
  redis_stage_data:
