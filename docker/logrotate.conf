# FileLoggerService holds its write streams open for the life of the
# process — there's no SIGHUP/reopen handling — so `copytruncate` is
# required here. A normal rename+recreate rotation would leave the app
# writing into a now-unlinked file forever.
/var/log/dress-doctor/*.log {
  daily
  rotate 14
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
}
