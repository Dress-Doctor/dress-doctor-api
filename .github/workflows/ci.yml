name: CI

on:
  push:
    branches: [prod, stage]
  pull_request:
    branches: [prod, stage]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    # Real Redis (BullMQ) via a service container; Mongo is an ephemeral
    # single-node replica set spun up in-process by mongodb-memory-server, so the
    # multi-document transaction paths (payment record, order confirm) are
    # actually exercised.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E (HTTP contract + CASL scoping + transactions)
        run: npm run test:e2e
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
