services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/main']
    env_file:
      - .env
    environment:
      PORT: '3000'
      DATABASE_URL: mongodb://mongo:27017/dress-doctor
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker']
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/dress-doctor
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
