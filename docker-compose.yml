# Production stack. Mongo is external (managed cluster) — configure
# DATABASE_URL in .env.prod. Attaches to a shared network (fixed name,
# not `external: true`) so stage and prod can coexist on the same
# host — whichever stack starts first creates it, the other reuses it.
# No manual setup step.
# Logs: the app itself writes api-error.log/api-combined.log and
# worker-error.log/worker-combined.log (see FileLoggerService) into
# LOG_DIR, which is bind-mounted to ./logs/prod on the host — survives
# `down` (not `down -v`, there's no named volume here). Docker's own
# json-file driver is also capped (10m x 5 files) as a second copy.
services:
  redis-prod:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - dress-doctor
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10

  api-prod:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/main']
    env_file:
      - .env.prod
    environment:
      PORT: '3000'
      REDIS_HOST: redis-prod
      REDIS_PORT: '6379'
      LOG_DIR: /var/log/dress-doctor
    ports:
      - '3000:3000'
    volumes:
      - ./logs/prod:/var/log/dress-doctor
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - dress-doctor
    depends_on:
      redis-prod:
        condition: service_healthy

  worker-prod:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker']
    env_file:
      - .env.prod
    environment:
      REDIS_HOST: redis-prod
      REDIS_PORT: '6379'
      LOG_DIR: /var/log/dress-doctor
    volumes:
      - ./logs/prod:/var/log/dress-doctor
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - dress-doctor
    depends_on:
      redis-prod:
        condition: service_healthy

networks:
  dress-doctor:
    name: dress-doctor-net

volumes:
  redis_prod_data:
